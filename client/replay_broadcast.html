@font-face {
  font-family: 'rajdhani';
  src: url('./font.ttf') format('truetype');
  font-display: block;
}

:root {
  --stage-lo: #16110d;
  --stage-hi: #241a12;
  --paper: #f2e8d8;
  --paper-dim: #b8ac98;
  --ink: #2a1f16;
  --ink-soft: rgba(20, 14, 9, 0.62);
  --red: #e0523a;
  --blue: #3f7cc4;
  --green: #45a85e;
  --yellow: #ddc531;
  --amber: #e8a33d;
  --ghost: #8a7f72;
  --hudscale: 1;
  /* chrome measures derive off the CONTAINER via --hudscale, not the viewport */
  --u: calc(1px * var(--hudscale));
  --pixfont: 'rajdhani', 'Segoe UI', system-ui, sans-serif;
  --finefont: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  /* The letterbox around the composition — warm near-black, NEVER pure #000.
     The Observatory embed hands us an arbitrary box; the fixed-aspect stage is
     centered inside it and this warm tone fills whatever is left over. */
  background: #120d09;
  color: var(--paper);
  font-family: var(--finefont);
  -webkit-font-smoothing: antialiased;
}

/* The embed box. The stage is ONE fixed-aspect composition centered inside it;
   board + every overlay live in the stage and scale together as a single unit
   (§2/L82: chrome sizes off the CONTAINER, not the viewport), so overlays never
   drift from the graphics at any embed size. */
#viewport {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#stage {
  position: relative;
  /* width/height are set in px by relayout() to the board's native aspect
     (1235:659) fitted into #viewport; the canvas fills it exactly (matching
     aspect → no internal letterbox) and all chrome is pinned in this space. */
  width: 100%;
  height: 100%;
  background:
    radial-gradient(120% 90% at 50% 38%, var(--stage-hi) 0%, var(--stage-lo) 72%);
  overflow: hidden;
}

/* The board fills the frame ABOVE the reserved transport band; broadcast_core
   letterboxes it to native aspect. --band is the bottom strip (set by relayout)
   where the transport lives, so no chrome ever sits over play. */
#board {
  position: absolute;
  left: 0;
  /* canvas is a replaced element: `inset` won't stretch it, so size explicitly.
     The board sits BETWEEN the reserved scorebug band (top) and transport band
     (bottom), so no chrome ever overlaps play. */
  top: var(--topband, 0px);
  width: 100%;
  height: calc(100% - var(--topband, 0px) - var(--band, 0px));
  display: block;
  image-rendering: pixelated;
  /* One-finger drags belong to the PAGE while the board is fitted; syncTouchAction
     takes them back (touch-action: none) once there is somewhere to pan. Neither
     value permits pinch-zoom, so the second finger always reaches our handler
     instead of zooming the document. */
  touch-action: pan-x pan-y;
}

/* A soft light pool focuses the eye on the arena (not a literal set). Matches
   the board area so it never darkens the reserved transport band below. */
#lightpool {
  position: absolute;
  inset: var(--topband, 0px) 0 var(--band, 0px) 0;
  pointer-events: none;
  background:
    radial-gradient(70% 58% at 50% 46%, transparent 40%, rgba(12, 8, 5, 0.34) 100%);
  z-index: 2;
}

/* CRT phosphor grain drift — ambient, paused under prefers-reduced-motion. */
#grain {
  position: absolute;
  inset: -20%;
  pointer-events: none;
  opacity: 0.05;
  z-index: 3;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.5) 0 1px, transparent 1px 3px);
  animation: graindrift 7s steps(4) infinite;
}
@keyframes graindrift { to { transform: translateY(3px); } }

#chrome {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  font-family: var(--pixfont);
}
#chrome > * { pointer-events: auto; }

/* Team color utility: any chrome element carrying a team-name class exposes
   that team's tint as --tc, and every team-colored rule below reads
   var(--tc, <neutral fallback>). Supporting a new team = one line here plus
   its art — no per-team selector pairs anywhere else. */
.red { --tc: var(--red); }
.blue { --tc: var(--blue); }
.green { --tc: var(--green); }
.yellow { --tc: var(--yellow); }

/* ---------- 1. TOP-BAND SCOREBUG ---------- */
#scorebug {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: grid;
  /* minmax(0,1fr), NOT 1fr: a bare 1fr track floors at its content's min-content
     width, so a long team name would blow the side track out and shove the center
     clock off-center. minmax(0,…) lets each side shrink to 0 and clip via the
     name's own ellipsis at the TRUE track edge — the name then uses all the plate
     room there actually is, instead of an arbitrary hard cap. */
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: stretch;
  /* Shrink the whole scorebug group (names, lives numerals, labels, squad pips,
     clock) 20% by scaling the local unit — every measure below derives from --u,
     so one override rescales the band without touching per-element sizes. */
  --u: calc(1px * var(--hudscale) * 0.8);
  gap: calc(6 * var(--u));
  padding: calc(6 * var(--u)) calc(12 * var(--u)) calc(7 * var(--u));
  /* Dedicated top band: a solid warm-dark strip that lives ABOVE the board (its
     measured height = --topband, reserved by relayout), so the scorebug never
     covers play — grenades/players at the top rows stay fully visible. Mirrors
     the bottom transport band. */
  box-sizing: border-box;
  background: var(--stage-lo);
  box-shadow: inset 0 calc(-1 * var(--u)) 0 rgba(242, 232, 216, 0.06);
}

/* One side of the scorebug: one plate per side for classic red/blue (exactly
   the old layout); a 3-4 team game puts BOTH of a side's plates on the same
   row (outer team at the screen edge, inner team beside the clock), so all
   four teams read on one line across the band. */
.plates {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: calc(5 * var(--u));
  min-width: 0;
}
.plates.row { flex-direction: row; align-items: center; gap: calc(18 * var(--u)); }
.plates.row .plate { flex: 1 1 0; }
.plate {
  display: flex;
  align-items: center;
  gap: calc(9 * var(--u));
  min-width: 0;
}
/* Orientation is a SIDE property, not a color property: right-side plates
   mirror so both team names stay innermost, flanking the clock. */
.plate.side-r { flex-direction: row-reverse; text-align: right; }

.plate .team-id { min-width: 0; }
.plate .team-name {
  font-family: var(--pixfont);
  font-size: calc(16 * var(--u));
  letter-spacing: 0.5px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  /* Inline with Lives + count on ONE row. Let the name shrink and ellipsis so a
     long policy name never pushes the label/count off the plate; the label and
     numeral hold their size. Full name still reads in the CARRYING line + roster.
     No max-width: the minmax(0,1fr) side track already bounds it, so the name
     grows to the full plate width and only ellipsizes when it genuinely runs out
     of room — not at an arbitrary early cap. */
  flex: 0 1 auto;
  min-width: 0;
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.plate .team-name { color: var(--tc, var(--paper)); }

/* One baseline row with the TEAM NAME innermost (toward the center clock):
   a left plate reads "32 LIVES RED", a right plate reads "BLUE LIVES 32", so
   names flank the clock. Left reverses; right keeps DOM order (name → label → num). */
.plate .lives-line {
  display: flex;
  align-items: baseline;
  gap: calc(6 * var(--u));
}
.plate.side-l .lives-line { flex-direction: row-reverse; }

/* center clock pill + phase */
.clock {
  position: relative; /* anchors the fast-forward mini indicator */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: calc(3 * var(--u));
  padding-top: calc(1 * var(--u));
}
/* Tiny amber ▸▸ riding the right of the match clock while skip-lulls is
   actually fast-forwarding — the at-a-glance "time is compressed" cue. */
.ffwd-mini {
  display: none;
  position: absolute;
  left: calc(100% + 5 * var(--u));
  top: calc(6 * var(--u));
  font-family: var(--pixfont);
  font-size: calc(12 * var(--u));
  color: var(--amber);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.ffwd-mini.show { display: block; }
.clock .time {
  font-family: var(--pixfont);
  /* The clock is the centerpiece: with the name folded into the lives row the
     side plates are one row shorter, so grow the time numeral into that freed
     vertical space and let it anchor the band. */
  font-size: calc(30 * var(--u));
  line-height: 1;
  color: var(--paper);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
  font-variant-numeric: tabular-nums;
}
.clock .caption {
  font-family: var(--finefont);
  font-size: calc(8.5 * var(--u));
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--paper-dim);
  white-space: nowrap;
}
.clock.tiebreak-warn .time { color: var(--amber); }

/* Center column holds just the clock now — the capture-chase gauge was retired
   in favor of the two bottom carry indicators. */
.clock-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(4 * var(--u));
}

/* Clock pill soft tick — the third chrome ambient (§11). A near-imperceptible
   breathe on the pill, so the countdown reads as a live instrument, not a label. */
.clock.amb { animation: clocktick 2s ease-in-out infinite; }
@keyframes clocktick { 0%,100% { opacity: 0.94; } 50% { opacity: 1; } }
@keyframes leaderpulse { 0%,100% { text-shadow: none; } 50% { text-shadow: 0 0 calc(10 * var(--u)) var(--amber); } }

/* ---------- 3. BANNER LANE ---------- */
#bannerlane {
  position: absolute;
  top: calc(78 * var(--u));
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  pointer-events: none;
  z-index: 12;
  min-height: calc(26 * var(--u)); /* reserved slot: layout never jumps */
}
.banner-chip {
  font-family: var(--pixfont);
  font-size: calc(13 * var(--u));
  letter-spacing: 0.06em;
  padding: calc(6 * var(--u)) calc(14 * var(--u));
  color: var(--paper);
  background: var(--ink-soft);
  border-bottom: calc(3 * var(--u)) solid var(--amber);
  text-transform: uppercase;
  white-space: nowrap;
  animation: chippop 300ms cubic-bezier(.2,1.4,.4,1);
}
.banner-chip.steal { border-bottom-color: var(--amber); }
.banner-chip.returned { border-bottom-color: var(--paper-dim); }
.banner-chip.wipe { border-bottom-color: var(--tc, var(--red)); font-size: calc(15 * var(--u)); }
/* the acting team's tint rides as a left accent bar (any team color) */
.banner-chip.accent { box-shadow: inset calc(4 * var(--u)) 0 0 var(--tc, var(--amber)); }
.banner-chip.leaving { animation: chipfade 260ms ease-in forwards; }
@keyframes chippop { from { transform: translateY(calc(-8 * var(--u))) scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes chipfade { to { opacity: 0; transform: translateY(calc(-4 * var(--u))); } }

/* ---------- 2. KILL FEED ---------- */
#killfeed {
  position: absolute;
  /* Bottom-right, clear of the blue scorebug/roster (top) and the transport
     bar (bottom). column-reverse so the newest row sits lowest, nearest the
     transport, and older kills stack upward — a broadcast lower-third feed. */
  bottom: calc(76 * var(--u));
  right: calc(12 * var(--u));
  display: flex;
  flex-direction: column-reverse;
  gap: calc(4 * var(--u));
  align-items: flex-end;
  width: calc(228 * var(--u));
  min-height: calc(4 * 22 * var(--u)); /* fixed 4-row reserve */
  z-index: 11;
  /* Rows are display-only (no click handlers) — never let the feed intercept a
     drag meant for the PiP or the board beneath it. */
  pointer-events: none;
}
.feed-row {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  padding: calc(3 * var(--u)) calc(7 * var(--u));
  background: var(--ink-soft);
  font-family: var(--pixfont);
  /* A touch smaller than the scorebug type so full 8-char names stay compact;
     everything is in --u so the row scales with the board (responsive). */
  font-size: calc(8 * var(--u));
  line-height: 1;
  /* Size to content so full names never truncate; rows are right-anchored
     (align-items:flex-end on #killfeed) so a long row grows leftward — bounded
     by the small font + the pre-bounded 10-char name, so it can't run away. */
  max-width: none;
  white-space: nowrap;
  animation: feedin 250ms cubic-bezier(.2,1.3,.5,1);
}
.feed-row.leaving { animation: feedout 260ms ease-in forwards; }
@keyframes feedin { from { transform: translateX(calc(30 * var(--u))); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes feedout { to { opacity: 0; transform: translateX(calc(14 * var(--u))); } }
.feed-row .who { white-space: nowrap; }  /* names are pre-bounded to 10 chars by shortName(); show in full, never ellipsize */
.feed-row .who { color: var(--tc, var(--paper)); }
.feed-row .glyph { color: var(--paper); font-size: calc(9 * var(--u)); }
.feed-row .badge {
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: calc(1 * var(--u)) calc(4 * var(--u));
  color: var(--stage-lo);
  background: var(--amber);
}
.feed-row .badge.tk { background: var(--red); color: var(--paper); }

/* ---------- 5. TRANSPORT ---------- */
#transport {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  /* Sits in the reserved band BELOW the board — relayout() measures this strip's
     natural height and reserves that much (--band) at the bottom of the frame, so
     the scrubber and buttons never overlap play. A solid warm-dark strip, not a
     fade — there is no arena underneath it to wash over. */
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  padding: calc(8 * var(--u)) calc(12 * var(--u)) calc(8 * var(--u));
  background: var(--stage-lo);
  box-shadow: inset 0 calc(1 * var(--u)) 0 rgba(242, 232, 216, 0.06);
}
#transport.disabled { opacity: 0.35; pointer-events: none; }

/* scrubber: click-to-seek track (top) over a full-timeline momentum graph.
   The seek track and the momentum graph share the SAME 0→maxTicks x-axis, so
   the playhead crosses the graph 1:1 with the timeline (no scrolling window). */
.scrub {
  position: relative;
  height: calc(34 * var(--u));
  cursor: pointer;
}
.scrub-track {
  position: absolute;
  left: 0; right: 0; top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: rgba(242, 232, 216, 0.16);
}
.scrub-fill {
  position: absolute;
  left: 0; top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: var(--paper);
  width: 0;
}
.scrub-head {
  /* spans track + graph so the playhead reads against the momentum curve */
  position: absolute;
  top: calc(2 * var(--u));
  width: calc(3 * var(--u));
  height: calc(30 * var(--u));
  background: var(--amber);
  transform: translateX(calc(-1.5 * var(--u)));
  left: 0;
  z-index: 3;
}
/* Full-timeline lives-lead graph, occupying the band UNDER the seek track. */
.momentum {
  position: absolute;
  /* An inline <svg> is a REPLACED element: with width:auto it takes its
     intrinsic viewBox ratio (1000×100 = 10:1) × height, NOT the left/right
     box — so it renders ~10× its height wide (a short stub) instead of full
     width. Pin width:100% so it spans the whole seek track, matching the
     0→maxTicks x-axis the playhead rides. (preserveAspectRatio:none, so no
     letterboxing when we override the ratio.) */
  left: 0; width: 100%; top: calc(12 * var(--u));
  height: calc(22 * var(--u));
  display: block;
  overflow: visible;
}
.momentum-label {
  position: absolute;
  left: 0; top: calc(13 * var(--u));
  font-family: var(--finefont);
  font-size: calc(6 * var(--u));
  letter-spacing: 0.12em;
  color: var(--paper-dim);
  opacity: 0.5;
  pointer-events: none;
  z-index: 2;
}
.beat-marker {
  position: absolute;
  top: 0;
  width: calc(2 * var(--u));
  height: calc(10 * var(--u));
  transform: translateX(-1px);
  z-index: 2;
}
/* winner cap: a flat block just past the track's right end, colored by the
   verdict (split for a draw), so the scrubber itself says how this ends. */
.scrub-win {
  display: none;
  position: absolute;
  right: calc(-4 * var(--u));
  top: calc(2 * var(--u));
  width: calc(6 * var(--u));
  height: calc(12 * var(--u));
  z-index: 3;
}
.scrub-win.show { display: block; background: var(--tc, var(--paper-dim)); }
/* verdict chip in the transport bar: "RED WINS" next to the tick clock. */
.win-chip {
  display: none;
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  padding: 0 calc(6 * var(--u));
  white-space: nowrap;
}
.win-chip.show { display: inline; }
.win-chip.show { color: var(--tc, var(--paper-dim)); }

.tbar {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  flex-wrap: wrap;
}
.tbtn {
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  color: var(--paper);
  background: rgba(242, 232, 216, 0.08);
  border: none;
  padding: calc(5 * var(--u)) calc(8 * var(--u));
  min-width: calc(26 * var(--u));
  cursor: pointer;
  line-height: 1;
}
.tbtn:hover { background: rgba(242, 232, 216, 0.2); }
.tbtn.on { color: var(--amber); box-shadow: inset 0 calc(-2 * var(--u)) 0 var(--amber); }
.tbtn svg { width: calc(12 * var(--u)); height: calc(12 * var(--u)); display: block; fill: currentColor; }
.tsep { flex: 1; }
/* skip-lulls: dim shading over the quiet scrubber stretches, plus an amber
   "skipping" chip in the tbar while the server is actually fast-forwarding. */
.lull-span {
  position: absolute;
  top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: rgba(18, 13, 9, 0.6);
  pointer-events: none;
}
.ffwd-chip {
  display: none;
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--amber);
  padding: 0 calc(6 * var(--u));
  white-space: nowrap;
}
.ffwd-chip.show { display: inline; }
.speedchips { display: flex; gap: calc(2 * var(--u)); }
.chip {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  background: rgba(242, 232, 216, 0.06);
  border: none;
  padding: calc(4 * var(--u)) calc(5 * var(--u));
  cursor: pointer;
  line-height: 1;
}
.chip.on { color: var(--stage-lo); background: var(--amber); }
.tick-clock {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* hash-mismatch warning (top center) — honest fidelity flag */
#mmwarn {
  position: absolute;
  top: calc(40 * var(--u));
  left: 50%;
  transform: translateX(-50%);
  display: none;
  padding: calc(3 * var(--u)) calc(9 * var(--u));
  background: var(--red);
  color: var(--paper);
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  z-index: 20;
}
#mmwarn.on { display: block; }

/* ---------- 6. END-CARD ---------- */
#endcard {
  position: absolute;
  /* Cover the BOARD region only — never the scorebug or transport bands. The
     transport must stay clickable under the end card so the scrubber can jump
     back into the match from the score screen (the card cancels server-side
     end-hold on seek). --topband/--band are the measured band heights that
     relayout() maintains on :root; in embed mode both are 0 and the card
     spans the whole iframe as before. */
  left: 0;
  right: 0;
  top: var(--topband, 0px);
  bottom: var(--band, 0px);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(12 * var(--u));
  background: radial-gradient(80% 70% at 50% 45%, rgba(16, 11, 7, 0.82), rgba(9, 6, 3, 0.95));
  z-index: 30;
  padding: calc(20 * var(--u));
  text-align: center;
}
#endcard.on { display: flex; animation: cardfade 420ms ease-out; }
@keyframes cardfade { from { opacity: 0; } to { opacity: 1; } }
#endcard .headline { color: var(--tc, var(--ghost)); }
#endcard .headline {
  font-family: var(--pixfont);
  font-size: calc(30 * var(--u));
  line-height: 1.05;
  color: var(--paper);
  text-shadow: 0 calc(3 * var(--u)) 0 var(--ink);
  /* headline now carries the (possibly long) policy name — never wrap/overflow */
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .how {
  font-family: var(--finefont);
  font-size: calc(11 * var(--u));
  letter-spacing: 0.05em;
  color: var(--paper-dim);
  max-width: calc(360 * var(--u));
}
/* win-condition chip — names HOW the match ended (heart / elimination / time) */
#endcard .wincond {
  font-family: var(--pixfont);
  font-size: calc(10 * var(--u));
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--amber);
  padding: calc(3 * var(--u)) calc(10 * var(--u));
  box-shadow: inset 0 0 0 1px rgba(232, 163, 61, 0.5);
}
#endcard .how {
  margin-top: calc(-4 * var(--u));
}
/* match-stats scoreboard — one panel per team, winner ringed in amber.
   Wraps + centers so a 3rd/4th team panel folds to a second row. */
#endcard .ec-teams {
  display: flex;
  gap: calc(22 * var(--u));
  align-items: stretch;
  flex-wrap: wrap;
  justify-content: center;
}
#endcard .ec-team {
  width: calc(215 * var(--u));
  padding: calc(9 * var(--u)) calc(12 * var(--u));
  background: rgba(20, 14, 9, 0.55);
  box-shadow: inset 0 0 0 1px rgba(242, 232, 216, 0.12);
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  text-align: left;
}
#endcard .ec-team.win {
  box-shadow: inset 0 0 0 1px rgba(232, 163, 61, 0.65),
    0 0 calc(14 * var(--u)) rgba(232, 163, 61, 0.18);
}
#endcard .ec-tname {
  font-family: var(--pixfont);
  font-size: calc(13 * var(--u));
  letter-spacing: 0.05em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .ec-tname { color: var(--tc, var(--paper)); }
#endcard .ec-lives { display: flex; align-items: baseline; gap: calc(6 * var(--u)); font-family: var(--pixfont); }
#endcard .fl-num { font-size: calc(22 * var(--u)); color: var(--tc, var(--paper)); }
/* mixed-team policy subheader: groups a team panel's rows by policy when a
   team seats more than one (CTF-Doubles: two policies per side) */
#endcard .ec-pol {
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper-dim);
  margin-top: calc(3 * var(--u));
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .fl-cap {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper-dim);
}
#endcard .ec-thead,
#endcard .ec-row {
  display: grid;
  grid-template-columns: 1fr calc(22 * var(--u)) calc(22 * var(--u)) calc(26 * var(--u)) calc(26 * var(--u));
  gap: calc(5 * var(--u));
  align-items: center;
}
#endcard .ec-thead {
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper-dim);
  border-bottom: 1px solid rgba(242, 232, 216, 0.18);
  padding-bottom: calc(3 * var(--u));
}
#endcard .ec-thead span:not(:first-child) { text-align: center; }
#endcard .ec-row {
  font-family: var(--pixfont);
  font-size: calc(10.5 * var(--u));
  color: var(--paper);
  padding: calc(1.5 * var(--u)) 0;
}
#endcard .ec-row .n { text-align: center; font-variant-numeric: tabular-nums; }
/* a 4-team match can retire several rival hearts (GV32: a capture eliminates
   its team and play continues), so the Cap cell lays its hearts in a row,
   later hearts shingling over earlier ones so three still fit the column */
#endcard .ec-row .n.cap {
  color: var(--amber);
  display: flex;
  justify-content: center;
  align-items: center;
}
#endcard .ec-row .n.cap > * + * { margin-left: calc(-7 * var(--u)); }
#endcard .ec-row .pname {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--paper-dim);
}
#endcard .ec-row.mvp .pname { color: var(--amber); }
/* name cell: name ellipsizes (but keeps a readable floor), the capture mark
   + honor badges ride after it; a pathological pileup clips inside the cell
   rather than bleeding into the K column */
#endcard .ec-row .pcell {
  display: flex;
  align-items: center;
  gap: calc(3 * var(--u));
  min-width: 0;
  overflow: hidden;
}
#endcard .ec-row .pcell .pname { flex: 0 1 auto; min-width: 7ch; }
/* honor badges: baked 2x pixel-art icons (nano-banana), luminance-keyed to
   transparency; a repeat count rides after the icon as fine print */
#endcard .ec-badge {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: calc(1 * var(--u));
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
}
#endcard .ec-badge::before {
  content: '';
  display: block;
  height: calc(14 * var(--u));
  background-size: contain;
  background-repeat: no-repeat;
  image-rendering: pixelated;
}

/* loop countdown — present only while the server holds the end segment */
#endcard .ec-replay {
  font-family: var(--finefont);
  font-size: calc(9 * var(--u));
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--paper-dim);
  min-height: calc(12 * var(--u));

#endcard .ec-replay b { color: var(--paper); font-variant-numeric: tabular-nums; }

/* connection status — fine print, lower-left */
#status {
  position: absolute;
  left: calc(10 * var(--u));
  bottom: calc(62 * var(--u));
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ghost);
  /* above the locker-room curtain (25): connection state stays readable
     while the pre-load scene is up */
  z-index: 26;
  pointer-events: none;
  opacity: 0;
  transition: opacity 200ms;
}
#status.show { opacity: 1; }

/* ============================================================
   PRE-LOAD CURTAIN — THE BOT LOCKER ROOM
   The wasm/replay boot can take seconds; instead of a dark board
   captioned "Warming up", the stage opens on the backstage room
   UNDER the arena: the four cogs prepping their paintball markers
   in a lamp-lit locker room. The scene is nanobanana-generated
   art (art/lockerroom/ — same warm Ink & Print world as the
   dungeon wall textures): ONE static empty-room plate (bg.jpg)
   with five alpha-sprite poses per cog (<bot>_<pose>.webp)
   layered on top and cycled per bot (see .lk-art below).
   Dismissed by the first ingested frame (dismissLockerRoom).
   Sits UNDER #status (fine-print
   connection state stays readable) and #mmwarn; shown in embed
   mode too — it IS the League Replayer's lit floor while loading.
   ============================================================ */
#lockerroom {
  position: absolute;
  inset: 0;
  z-index: 25;
  overflow: hidden;
  font-family: var(--pixfont);
  background: radial-gradient(120% 95% at 50% 30%, var(--stage-hi) 0%, var(--stage-lo) 55%, #100b07 100%);
  opacity: 1;
  transition: opacity 600ms ease;
}
#lockerroom.gone { opacity: 0; pointer-events: none; }

/* hanging-lamp light: an amber pool over the room + a low bounce off the
   floor, with the occasional basement-fixture flicker */
#lockerroom .lk-glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(46% 60% at 50% 28%, rgba(232, 163, 61, 0.15), transparent 70%),
    radial-gradient(62% 26% at 50% 88%, rgba(232, 163, 61, 0.08), transparent 75%);
  animation: lk-flicker 9s linear infinite;
}
@keyframes lk-flicker {
  0%, 86%, 90%, 95%, 100% { opacity: 1; }
  88% { opacity: 0.78; }
  93% { opacity: 0.9; }
}

/* The scene: ONE static background plate (bg.jpg — the empty room) with
   the four cogs layered on top as freestanding alpha sprites, five
   generated poses each. Every bot runs its own pose carousel (distinct
   cycle length + phase, crossfaded windows) over its own idle sway, so
   the composed scene never repeats for minutes — smooth continuous
   animation over a rock-solid background. A soft radial mask melts the
   plate's edges into the stage gradient, and the whole scene breathes
   on a slow zoom. */
#lockerroom .lk-art {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: lk-breathe 14s ease-in-out infinite alternate;
}
@keyframes lk-breathe { from { transform: scale(1); } to { transform: scale(1.03); } }
#lockerroom .lk-bg {
  display: block;
  max-width: 94%;
  max-height: 96%;
  -webkit-mask-image: radial-gradient(ellipse 74% 80% at 50% 48%, #000 50%, transparent 99%);
  mask-image: radial-gradient(ellipse 74% 80% at 50% 48%, #000 50%, transparent 99%);
}
/* sprite plane, fitted to the bg image's box by fitLockerSprites() */
#lockerroom .lk-sprites { position: absolute; }
/* one wrapper per bot (anchored over its floor spot, carries the idle
   sway), its pose sprites stacked bottom-center inside */
#lockerroom .lk-boto { position: absolute; transform-origin: 50% 100%; }
#lockerroom .lk-boto img {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  opacity: 0;
  animation: lk-pose var(--cyc, 4s) linear infinite;
}
/* each pose owns a crossfaded 1/5 window of its bot's cycle (delay-shifted) */
@keyframes lk-pose {
  0% { opacity: 0; }
  4% { opacity: 1; }
  20% { opacity: 1; }
  24% { opacity: 0; }
  100% { opacity: 0; }
}
/* idle sway per seat: subtle, distinct tempi so the row never metronomes */
@keyframes lk-sway { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-1.5px) rotate(0.6deg); } }
#lockerroom .lk-boto:nth-child(1) { animation: lk-sway 3.4s ease-in-out infinite; }
#lockerroom .lk-boto:nth-child(2) { animation: lk-sway 2.9s ease-in-out -1.2s infinite; }
#lockerroom .lk-boto:nth-child(3) { animation: lk-sway 3.8s ease-in-out -0.6s infinite; }
#lockerroom .lk-boto:nth-child(4) { animation: lk-sway 3.1s ease-in-out -2s infinite; }

/* rotating prep-talk line + amber scan bar + fine print, over the floor */
#lockerroom .lk-cap {
  position: absolute;
  bottom: 13%;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--finefont);
  font-size: calc(11 * var(--u));
  color: var(--paper-dim);
  text-shadow: 0 1px 0 rgba(10, 7, 4, 0.8), 0 0 calc(8 * var(--u)) rgba(10, 7, 4, 0.9);
  transition: opacity 150ms;
}
#lockerroom .lk-cap.swap { opacity: 0; }
#lockerroom .lk-bar {
  position: absolute;
  bottom: 10.2%;
  left: 50%;
  transform: translateX(-50%);
  width: calc(150 * var(--u));
  height: calc(3 * var(--u));
  background: rgba(242, 232, 216, 0.12);
  border-radius: calc(2 * var(--u));
  overflow: hidden;
}
#lockerroom .lk-bar i {
  position: absolute;
  top: 0; bottom: 0;
  left: -34%;
  width: 34%;
  border-radius: calc(2 * var(--u));
  background: linear-gradient(90deg, transparent, var(--amber), transparent);
  animation: lk-scan 1.6s ease-in-out infinite alternate;
}
@keyframes lk-scan { from { left: -34%; } to { left: 100%; } }
#lockerroom .lk-sub {
  position: absolute;
  bottom: 6.4%;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ghost);
  text-shadow: 0 1px 0 rgba(10, 7, 4, 0.9);
}

@media (prefers-reduced-motion: reduce) {
  #lockerroom * { animation: none !important; }
  /* with the carousels stopped, hold each bot's rest pose over the plate */
  #lockerroom .lk-boto img:first-child { opacity: 1; }
}

/* ============================================================
   The replay is ONE fixed-aspect composition (relayout() sizes #stage to the
   board's 1235:659 aspect inside the embed box), so there is no portrait/reflow
   case: at every container shape the board and its overlays scale together as a
   single unit and stay pinned. The only responsive lever is chrome DENSITY —
   `.tiny` eases the reserves so the 640×360 floor stays legible.
   ============================================================ */
/* very small floor (≤620px stage): tighten reserves */
#stage.tiny #killfeed { min-height: calc(3 * 20 * var(--u)); width: calc(190 * var(--u)); }

@media (prefers-reduced-motion: reduce) {
  #grain, .clock.amb { animation: none; }
  .banner-chip, .feed-row { animation-duration: 1ms; }
}

/* ============================================================
   EMBED MODE — inside the League Replayer shell (?embed=1)
   The shell owns the walls + team headers + KDA + standings + transport, drawn
   from the postMessage frame stream. Here we show the board (the lit pit floor)
   PLUS the designed broadcast feedback layer that belongs over the play area —
   the kill feed and the flag-event banner lane (lower-third / center wipes).
   We hide only the chrome the shell re-draws (scorebug/transport) and the
   ambient light-pool/grain/status, and let the board fill the embed box.
   ============================================================ */
body[data-embed] #scorebug,
body[data-embed] #transport,
body[data-embed] #lightpool,
body[data-embed] #grain,
body[data-embed] #status { display: none !important; }
body[data-embed] #board { top: 0; height: 100%; }
</style>
</head>
<body>
<div id="viewport">
<div id="stage">
  <canvas id="board"></canvas>
  <div id="lightpool"></div>
  <div id="grain" class="amb"></div>

  <!-- Pre-load curtain: the bot locker room. The six art frames (srcs set by
       buildLockerRoom — the path prefix is delivery-mode dependent) play as a
       ~4fps idle loop; the whole scene fades out on the first ingested
       frame (dismissLockerRoom). role=status so screen readers hear one
       "Loading replay" while the visual squad preps their markers. -->
  <div id="lockerroom" role="status" aria-label="Loading replay">
    <div class="lk-art" id="lk-art" aria-hidden="true">
      <img class="lk-bg" id="lk-bg" alt="">
      <div class="lk-sprites" id="lk-sprites"></div>
    </div>
    <div class="lk-glow" aria-hidden="true"></div>
    <div class="lk-cap" id="lk-cap" aria-hidden="true">Forming up on the line&hellip;</div>
    <div class="lk-bar" aria-hidden="true"><i></i></div>
    <div class="lk-sub">Muster room &middot; Loading replay</div>
  </div>

  <div id="chrome">
    <!-- Plates are generated per active team (2-4) by ensureScorebug(): one
         per side for classic red/blue, two stacked per side for 3-4 teams.
         Each plate holds a flag icon, one inline NAME · Lives · count row
         (mirrored on the right so names flank the clock), and the squad pip
         strip (one pip per player: alive / down / eliminated; clickable →
         POV lens). -->
    <div id="scorebug">
      <div class="plates" id="plates-l"></div>

      <div class="clock-col">
        <div class="clock amb" id="clock">
          <div class="time" id="clock-time">0:00</div>
          <span class="ffwd-mini" id="ffwd-mini">▸▸</span>
          <div class="caption" id="clock-caption">Mustering</div>
        </div>
      </div>

      <div class="plates" id="plates-r"></div>
    </div>

    <div id="mmwarn">Replay hash mismatch — showing recorded orders</div>
    <div id="bannerlane"></div>
    <div id="killfeed"></div>

    <div id="transport">
      <!-- Buttons on top, scrubber/timeline below (the transport sits in its own
           reserved band under the board, so nothing here overlaps play). -->
      <div class="tbar">
        <button class="tbtn" id="btn-restart" title="Restart (,)">⟲</button>
        <button class="tbtn" id="btn-back" title="Back one tick (b)">◂|</button>
        <button class="tbtn" id="btn-play" title="Play / pause (space)">▶</button>
        <button class="tbtn" id="btn-fwd" title="Skip +5s (.)">+5s</button>
        <button class="tbtn" id="btn-end" title="Jump to end (e)">|▸</button>
        <button class="tbtn" id="btn-loop" title="Loop (r)">↻</button>
        <button class="tbtn" id="btn-skip" title="Auto-skip lulls (f)">▸▸</button>
        <button class="tbtn" id="btn-spoilers" title="Spoilers: kills / routs / winner on the timeline ahead of the playhead (o)">spoilers</button>
        <span class="ffwd-chip" id="ffwd-chip">▸▸ SKIPPING LULL</span>
        <span class="win-chip" id="win-chip"></span>
        <span class="tick-clock" id="tick-clock">0 / 0</span>
        <span class="tsep"></span>
        <div class="speedchips" id="speedchips"></div>
      </div>
      <div class="scrub" id="scrub">
        <!-- momentum graph sits UNDERNEATH the seek track, on the SAME tick/mx
             axis, so the playhead crosses it 1:1 with the timeline -->
        <svg class="momentum" id="momentum" viewBox="0 0 1000 100"
             preserveAspectRatio="none" aria-hidden="true"></svg>
        <span class="momentum-label">TROOPS LEAD</span>
        <div class="scrub-track"></div>
        <div class="scrub-fill" id="scrub-fill"></div>
        <!-- lull shading rides ABOVE track+fill so the quiet stretches read
             dimmed whether played or not; the amber head still wins (z:3) -->
        <div id="lulls"></div>
        <div class="scrub-win" id="scrub-win"></div>
        <div class="scrub-head" id="scrub-head"></div>
      </div>
    </div>

    <div id="endcard">
      <div class="headline" id="ec-headline">—</div>
      <div class="wincond" id="ec-wincond"></div>
      <div class="how" id="ec-how"></div>
      <!-- One stats panel per active team, generated by ensureEndcardTeams(). -->
      <div class="ec-teams" id="ec-teams"></div>
      <div class="ec-replay" id="ec-replay"></div>
    </div>
  </div>

  <div id="status">connecting</div>
</div>
</div>

<!-- WIRE_CONSTANTS -->
<!-- CHROME_COMMON -->
<!-- BROADCAST_CORE -->

<script>
(function () {
  'use strict';

  // Shared replay chrome (chrome_common.js, spliced over the CHROME_COMMON
  // marker by the server / dist bundle; the literal marker must not appear
  // inside this script or the splice would corrupt it). A raw file:// open of
  // this source has no splice -- same non-functional baseline as the missing
  // BROADCAST_CORE -- so fail loud and early instead of throwing mid-file.
  if (!window.ChromeCommon) {
    console.error('replay_broadcast: chrome_common.js missing - this page must be served spliced (native server or dist bundle), not opened raw.');
    return;
  }
  var C = window.ChromeCommon({
    send: function (cmd) { send(cmd); },
    sendPov: function () {},
    getState: function () { return lastState; }
  });
  // Aliases so the per-view code below reads exactly as before.
  var RED = C.RED, BLUE = C.BLUE, AMBER = C.AMBER, PAPER = C.PAPER;
  var GREEN = C.GREEN, YELLOW = C.YELLOW;
  var TEAM_ORDER = C.TEAM_ORDER, TEAM_COLOR = C.TEAM_COLOR;
  var teamCol = C.teamCol, activeTeams = C.activeTeams, teamOf = C.teamOf;
  var otherTeam = C.otherTeam, stripSeatSuffix = C.stripSeatSuffix;
  var teamPolicies = C.teamPolicies, teamName = C.teamName, teamHeadline = C.teamHeadline;
  var rosterName = C.rosterName, setName = C.setName, esc = C.esc, fmt = C.fmt;
  var togglePov = C.togglePov, renderClock = C.renderClock, renderTransport = C.renderTransport;
  var ingestLullSpans = C.ingestLullSpans, renderLullSpans = C.renderLullSpans;
  var markBeat = C.markBeat, killMarkerTeam = C.killMarkerTeam, renderBeatMarkers = C.renderBeatMarkers;
  var captureTeam = C.captureTeam, ingestBeats = C.ingestBeats, setVerdict = C.setVerdict;
  var ingestLeadSeries = C.ingestLeadSeries, recordMomentum = C.recordMomentum;
  var renderMomentum = C.renderMomentum;
  var getSpoilers = C.getSpoilers, setSpoilers = C.setSpoilers;

  // Engine-authoritative wire constants (read via the shared chrome; the
  // fallback literals for raw file:// opens live in chrome_common.js).
  var WIRE = C.WIRE, SPEEDS = C.SPEEDS, FPS = C.FPS;

  // ART_BASE, not a root-absolute "/client/...": this page is served from
  // three places and a leading slash is only correct at one of them.
  //  - native server, bare:      /client/replay          -> "" + /client/...
  //  - native server, proxied:   /<prefix>/client/replay
  //  - the STATIC WASM BUNDLE:   .../index.html, where the assets sit NEXT TO
  //    the page and there is no server at all.
  var ART_BASE = window.MagentStaticReplay
    ? '.'
    : location.pathname.replace(/\/clients?\/[^/]*$/, '') + '/client';

  // Two independent tempo levers, both the starter's:
  //  (1) ANIM_MAX_FACTOR -- chrome beat animations never play faster than this
  //      no matter the replay speed, so feed rows keep their read time.
  //  (2) DWELL_FLOOR_MS -- a beat's on-screen hold has a wall-clock minimum.
  var ANIM_MAX_FACTOR = 2;
  var DWELL_FLOOR_MS = { feed: 2600, banner: 1900, curtain: 2400, read: 600 };
  function animFactor() {
    var sp = (lastState && lastState.sp) || 1;
    return Math.min(sp, ANIM_MAX_FACTOR);
  }
  function dwellFloor(kind) {
    return DWELL_FLOOR_MS[kind] || DWELL_FLOOR_MS.read;
  }
  var beatPulseTimer = null;
  function beatPulse() {
    stage.classList.add('beat-active');
    if (beatPulseTimer) clearTimeout(beatPulseTimer);
    beatPulseTimer = setTimeout(function () {
      stage.classList.remove('beat-active');
      beatPulseTimer = null;
    }, dwellFloor('read'));
  }

  var $ = C.$;
  var viewport = $('viewport');
  var stage = $('stage');
  var canvas = $('board');
  var statusEl = $('status');

  // ---- pre-load curtain: the muster room -----------------------------------
  // The stage opens on this scene while the wasm sim boots. The art frames are
  // wired here (their base path is delivery-mode dependent); the first
  // ingested frame calls dismissLockerRoom(), which fades the room out after a
  // short minimum dwell -- a sub-second load would otherwise flash the scene
  // like a glitch.
  var lockerEl = $('lockerroom');
  var LOCKER_MIN_DWELL_MS = 900;
  var lockerShownAt = Date.now();
  var lockerCapTimer = null, lockerGone = false;
  (function buildLockerRoom() {
    var artBase = ART_BASE + '/art/lockerroom';
    $('lk-bg').src = artBase + '/bg.jpg';
    // Sprite geometry baked by the extraction script: ax/ay anchor each cog's
    // bottom-center on the plate, w/h size each pose -- all in % of the plate,
    // so everything scales together. Two armies here, not four teams, so the
    // two anchors are the plate's outer thirds.
    var LK_BOTS = {
      red:  { ax: 30.0, ay: 77.0, cyc: 4.1,
        poses: [{ f: 1, w: 18.15, h: 18.79 }, { f: 2, w: 15.93, h: 20.19 },
                { f: 3, w: 15.52, h: 19.87 }, { f: 5, w: 15.83, h: 20.63 },
                { f: 6, w: 16.73, h: 21.06 }] },
      blue: { ax: 70.0, ay: 76.67, cyc: 3.8,
        poses: [{ f: 1, w: 16.63, h: 18.25 }, { f: 2, w: 14.92, h: 21.6 },
                { f: 3, w: 15.83, h: 21.81 }, { f: 5, w: 16.63, h: 20.63 },
                { f: 6, w: 14.62, h: 22.68 }] }
    };
    var spritesEl = $('lk-sprites');
    ['red', 'blue'].forEach(function (bot) {
      var b = LK_BOTS[bot];
      var maxW = 0, maxH = 0;
      b.poses.forEach(function (p) {
        maxW = Math.max(maxW, p.w);
        maxH = Math.max(maxH, p.h);
      });
      var wrap = document.createElement('div');
      wrap.className = 'lk-boto';
      wrap.style.left = (b.ax - maxW / 2) + '%';
      wrap.style.top = (b.ay - maxH) + '%';
      wrap.style.width = maxW + '%';
      wrap.style.height = maxH + '%';
      b.poses.forEach(function (p, ix) {
        var img = document.createElement('img');
        img.alt = '';
        img.src = artBase + '/' + bot + '_' + p.f + '.webp';
        img.style.width = (p.w / maxW * 100) + '%';
        img.style.setProperty('--cyc', b.cyc + 's');
        img.style.animationDelay = (ix * b.cyc / b.poses.length) + 's';
        wrap.appendChild(img);
      });
      spritesEl.appendChild(wrap);
    });

    var bgImg = $('lk-bg');
    function fitLockerSprites() {
      spritesEl.style.left = bgImg.offsetLeft + 'px';
      spritesEl.style.top = bgImg.offsetTop + 'px';
      spritesEl.style.width = bgImg.offsetWidth + 'px';
      spritesEl.style.height = bgImg.offsetHeight + 'px';
    }
    bgImg.addEventListener('load', fitLockerSprites);
    if (window.ResizeObserver) new ResizeObserver(fitLockerSprites).observe(bgImg);
    window.addEventListener('resize', fitLockerSprites);
    fitLockerSprites();

    // rotating prep-talk line under the scene
    var lines = [
      'Forming up on the line\u2026',
      'Dressing the ranks\u2026',
      'Sergeants counting off by squad\u2026',
      'Nine squads, one order each\u2026',
      'Sizing up the open ground\u2026',
      'Checking the wings\u2026'
    ];
    var capEl = $('lk-cap'), capIx = 0;
    lockerCapTimer = setInterval(function () {
      capEl.classList.add('swap');
      setTimeout(function () {
        capIx = (capIx + 1) % lines.length;
        capEl.textContent = lines[capIx];
        capEl.classList.remove('swap');
      }, 180);
    }, 2600);
  })();
  function dismissLockerRoom() {
    if (lockerGone) return;
    lockerGone = true;
    var wait = Math.max(0, LOCKER_MIN_DWELL_MS - (Date.now() - lockerShownAt));
    setTimeout(function () {
      lockerEl.classList.add('gone');
      setTimeout(function () {
        lockerEl.style.display = 'none';
        if (lockerCapTimer) { clearInterval(lockerCapTimer); lockerCapTimer = null; }
      }, 650);
    }, wait);
  }

  // ---- embed mode ----------------------------------------------------------
  // When loaded inside a shell (?embed=1) this client renders ONLY the board
  // (its own scorebug/transport/feed chrome is hidden by CSS via
  // body[data-embed]) and streams each parsed state frame up to the parent
  // shell over postMessage.
  var EMBED = false;
  try { EMBED = new URLSearchParams(location.search).get('embed') === '1'; } catch (e) {}
  if (EMBED) document.body.setAttribute('data-embed', '1');

  // Tick deep-link (?t=<tick>): seek there on load via the same s: command the
  // scrubber uses. One-shot, fired on the first ingested frame so the replay
  // runtime is ready.
  var SEEK_T = null;
  try {
    var seekRaw = new URLSearchParams(location.search).get('t');
    if (seekRaw != null && /^\d+$/.test(seekRaw)) SEEK_T = parseInt(seekRaw, 10);
  } catch (e) {}

  function postToShell(type, payload) {
    if (!EMBED || window.parent === window) return;
    try { window.parent.postMessage({ src: 'magent-replay', type: type, data: payload }, '*'); } catch (e) {}
  }

  // The whole replay is ONE fixed-aspect composition locked to the board's
  // native size. The board is a SQUARE integer grid, so the aspect is 1:1 at
  // every mapSize and never changes mid-episode -- which is the reason the
  // zoom bar and minimap are gone: relayout() fits the whole board at every
  // width, and at the 360 px featured-match embed each of 45 cells is 8 px.
  var BOARD_ASPECT = 1;

  // ---- core (board renderer + WS) ----
  var lastState = null;
  var MG_CTX = null;             // filled at the end of this IIFE (hoisted)
  // A scrubber click that arrives before the first chrome frame is REMEMBERED
  // and resolved on the first frame that carries the axis -- the same one-shot
  // shape as ?t=.
  var SEEK_FRAC = null;
  var replayAdapter = window.MagentStaticReplay || null;
  var coreConfig = {
    canvas: canvas,
    websocket: replayAdapter ? false : websocketUrl(),
    onText: function (txt) { onFrame(txt); },
    onStatus: function (st) { onStatus(st); },
    onFirstFrame: function () { core.setViewportFit(); }
  };
  var core = replayAdapter
    ? replayAdapter.createCore(coreConfig)
    : window.BroadcastCore.create(coreConfig);

  function websocketUrl() {
    var scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var prefix = location.pathname.replace(/\/clients?\/[^/]*$/, '');
    return scheme + '//' + location.host + prefix + '/global';
  }

  postToShell('boot');

  function send(cmd) { core.sendCommand(cmd); }

  if (EMBED) {
    window.addEventListener('message', function (ev) {
      var m = ev.data;
      if (!m || m.src !== 'magent-shell') return;
      if (m.type === 'cmd' && typeof m.cmd === 'string') send(m.cmd);
      else if (m.type === 'seek' && m.tick != null) send('s:' + m.tick);
    });
  }

  function onStatus(st) {
    statusEl.textContent = st;
    statusEl.classList.toggle('show', st !== 'open');
  }

  // ============================================================
  //  Frame ingest
  // ============================================================
  var lastTick = -1;
  var lastFf = false;   // previous frame's fast-forward state (jump detection)
  // (beat markers, lull spans, beats timeline and momentum state live in the
  // shared chrome closure -- see chrome_common.js)

  function onFrame(txt) {
    var s;
    try { s = JSON.parse(txt); } catch (e) { return; }
    if (!s || !s.mg) return;
    lastState = s;
    dismissLockerRoom();

    // A backward jump (a seek, or a loop restart) clears everything that
    // accumulates forward, so the chrome never shows a stale future.
    var jumped = (s.t < lastTick) || (lastFf && !s.ff);
    if (jumped) { clearFeed(); clearBanners(); }
    lastTick = s.t;
    lastFf = !!s.ff;

    ingestLullSpans(s);
    ingestBeats(s);
    ingestLeadSeries(s);
    recordMomentum(s);
    renderTransport(s);
    renderScorebug(s);
    renderClockLine(s);
    renderMismatch(s);
    renderEndcard(s);
    if (window.MagentChrome) window.MagentChrome.frame(s, MG_CTX, jumped);

    if (SEEK_T != null && s.en) { var t = SEEK_T; SEEK_T = null; send('s:' + t); }
    if (SEEK_FRAC != null && s.en) {
      var frac = SEEK_FRAC; SEEK_FRAC = null; seekToFraction(s, frac);
    }
    postToShell('frame', s);
  }

  // ---------- scorebug ----------
  // Two plates: the seat's REAL policy name (spectator side only), its in-game
  // alias, a small side chip showing which colour it holds this game, the ALIVE
  // count as the big numeral and kills as the small one, and a fallback glyph on
  // any seat that has taken one.
  var sbBuilt = false;
  function ensureScorebug() {
    if (sbBuilt) return;
    sbBuilt = true;
    [['plates-l', 0], ['plates-r', 1]].forEach(function (pair) {
      var host = $(pair[0]);
      host.innerHTML =
        '<div class="plate' + (pair[1] === 1 ? ' side-r' : '') + '" id="plate-' + pair[1] + '">' +
        '<span class="side-chip" id="side-' + pair[1] + '"></span>' +
        '<span class="plate-name" id="pname-' + pair[1] + '"></span>' +
        '<span class="plate-alias" id="palias-' + pair[1] + '"></span>' +
        '<span class="alive-label">Alive</span>' +
        '<span class="alive-num" id="palive-' + pair[1] + '"></span>' +
        '<span class="kill-num" id="pkills-' + pair[1] + '"></span>' +
        '<span class="fb-glyph" id="pfb-' + pair[1] + '"></span>' +
        '</div>';
    });
  }
  function renderScorebug(s) {
    ensureScorebug();
    var seats = s.mg.seats || [];
    for (var i = 0; i < 2; i++) {
      var seat = seats[i] || {};
      var plate = $('plate-' + i);
      if (plate) plate.style.color = seat.side === 'red' ? RED : BLUE;
      var chip = $('side-' + i);
      if (chip) {
        chip.textContent = seat.side === 'red' ? 'red' : 'blue';
        chip.style.background = seat.side === 'red' ? RED : BLUE;
      }
      setName('pname-' + i, teamHeadline(seat.name || ''));
      setName('palias-' + i, seat.alias || '');
      setName('palive-' + i, String(seat.alive != null ? seat.alive : 0));
      setName('pkills-' + i, String(seat.kills != null ? seat.kills : 0));
      setName('pfb-' + i, (seat.fallbacks > 0) ? '\u21af' : '');
    }
  }

  // ---------- clock ----------
  // #clock-time reads the pair and the command turn; #clock-caption reads the
  // tick and the live count. renderClock (chrome_common) is deliberately not
  // called: its captions are for a single-game match with a countdown, and this
  // is a two-game pair scored on soldiers standing.
  function renderClockLine(s) {
    var mg = s.mg;
    setName('clock-time',
      'game ' + mg.game + '/' + mg.games + ' \u00b7 turn ' +
      Math.max(1, mg.turn) + '/' + mg.turns);
    setName('clock-caption',
      'tick ' + mg.tick + '/' + mg.maxTicks + ' \u00b7 ' +
      mg.alive[0] + ' v ' + mg.alive[1]);
  }

  function renderMismatch(s) {
    var el = $('mmwarn');
    var tick = s.mg.mismatchTick;
    if (tick != null && tick >= 0) {
      el.textContent = 'Replay hash mismatch at tick ' + tick +
        ' \u2014 showing recorded orders';
      el.classList.add('show');
    } else {
      el.classList.remove('show');
    }
  }

  // ---------- match feed ----------
  var feedEl = $('killfeed');
  var MAX_FEED = 4;
  function pushFeed(row) {
    feedEl.insertBefore(row, feedEl.firstChild);
    while (feedEl.children.length > MAX_FEED) feedEl.removeChild(feedEl.lastChild);
    // Dwell floor (lever 2): a wall-clock minimum so the row reads even at 8x.
    var hold = dwellFloor('feed');
    // animFactor cap (lever 1): the slide-in duration never dips below its
    // read-time, so the row still overshoots-and-settles legibly at high speed.
    row.style.animationDuration = (250 / animFactor()) + 'ms';
    setTimeout(function () {
      if (row.parentNode) { row.classList.add('leaving'); setTimeout(function () { if (row.parentNode) row.parentNode.removeChild(row); }, 300); }
    }, hold);
  }
  function clearFeed() { feedEl.innerHTML = ''; }

  // ---------- banner lane queue (one at a time, min hold) ----------
  var bannerEl = $('bannerlane');
  var bannerQueue = [];
  var bannerBusy = false;
  function banner(text, cls) {
    bannerQueue.push({ text: text, cls: cls });
    pumpBanner();
  }
  function pumpBanner() {
    if (bannerBusy || !bannerQueue.length) return;
    bannerBusy = true;
    var b = bannerQueue.shift();
    var chip = document.createElement('div');
    chip.className = 'banner-chip ' + b.cls;
    chip.textContent = b.text;
    bannerEl.appendChild(chip);
    chip.style.animationDuration = (300 / animFactor()) + 'ms';
    var hold = dwellFloor('banner');
    setTimeout(function () {
      chip.classList.add('leaving');
      setTimeout(function () {
        if (chip.parentNode) chip.parentNode.removeChild(chip);
        bannerBusy = false;
        pumpBanner();
      }, 260);
    }, hold);
  }
  function clearBanners() {
    bannerQueue = [];
    bannerEl.innerHTML = '';
    bannerBusy = false;
  }

  // ============================================================
  //  End-card -- the END SEGMENT: verdict, win condition and match stats.
  //  It stops at var(--band) so the scrubber stays clickable underneath, and
  //  every seek dismisses it (both the starter's rules, kept).
  // ============================================================
  var ecBuilt = false;
  function ensureEndcardTeams() {
    if (ecBuilt) return;
    ecBuilt = true;
    var host = $('ec-teams');
    host.innerHTML =
      '<div class="ec-team" id="ec-team-0"></div>' +
      '<div class="ec-team" id="ec-team-1"></div>';
  }
  function renderEndcardRows(s, slot) {
    var card = s.mg.endcard;
    var seat = (s.mg.seats || [])[slot] || {};
    var alias = seat.alias || ('SEAT ' + slot);
    return '' +
      '<div class="ec-tname" style="color:' +
        (seat.side === 'red' ? RED : BLUE) + '">' + esc(alias) +
        ' <span class="side-chip" style="background:' +
        (seat.side === 'red' ? RED : BLUE) + '">' + esc(seat.side || '') +
        '</span></div>' +
      '<div class="ec-thead"><span>Commander</span><span>Kills</span>' +
        '<span>Lost</span><span>Alive</span><span>Reward</span></div>' +
      '<div class="ec-trow"><span>' + esc(teamHeadline(seat.name || '')) +
        '</span><span>' + card.kills[slot] + '</span><span>' +
        card.lost[slot] + '</span><span>' + card.survivors[slot] +
        '</span><span>' + esc(card.reward[slot]) + '</span></div>' +
      '<div class="ec-tfoot"><span class="fl-cap">Troops left</span>' +
        '<span class="fl-num">' + card.survivors[slot] + '</span></div>';
  }
  function renderEndcard(s) {
    var card = s.mg.endcard;
    var el = $('endcard');
    if (!card || s.ph !== 'gameover' || !card.complete) {
      el.classList.remove('on');
      return;
    }
    ensureEndcardTeams();
    var seats = s.mg.seats || [];
    var lead = card.scores[0] >= card.scores[1] ? 0 : 1;
    var other = 1 - lead;
    var aliasLead = (seats[lead] || {}).alias || 'ALPHA';
    var headline = card.scores[lead] === card.scores[other]
      ? 'THE PAIR IS DRAWN \u2014 ' + card.survivors[0] + ' TO ' + card.survivors[1]
      : aliasLead + ' TAKES THE PAIR ' + card.gameWins[lead] + '\u2013' +
        card.gameWins[other] + ' \u2014 ' + card.survivors[lead] +
        ' SURVIVORS TO ' + card.survivors[other];
    setName('ec-headline', headline);
    setName('ec-wincond',
      'SCORE ' + (card.scores[0] > 0 ? '+' : '') + card.scores[0] + ' / ' +
      (card.scores[1] > 0 ? '+' : '') + card.scores[1]);
    var how = [];
    for (var g = 0; g < card.games.length; g++) {
      var game = card.games[g];
      how.push('game ' + game.game + ': ' + game.survivors[0] + '\u2013' +
        game.survivors[1] + ' (' + game.endRule + ', ' + game.ticks + ' ticks)');
    }
    setName('ec-how', how.join(' \u00b7 ') + ' \u00b7 ' + card.reason);
    $('ec-team-0').innerHTML = renderEndcardRows(s, 0);
    $('ec-team-1').innerHTML = renderEndcardRows(s, 1);
    setName('ec-replay', '');
    el.classList.add('on');
    // The shared chrome's winner cap (#scrub-win) and WINS chip (#win-chip)
    // are fed by ingestBeats' `gameover` kind, which this game never emits --
    // so both ids stayed empty for the whole replay. Feed them here instead,
    // through the chrome's own documented fallback path ("older servers that
    // ship no beats still get the verdict once playback reaches the end"), in
    // this game's vocabulary: the ALIAS takes the pair, never a colour.
    // setVerdict is idempotent and spoiler-gated by the chrome.
    setVerdict(card.scores[lead] === card.scores[other]
      ? { draw: true, t: s.t }
      : { winner: aliasLead, t: s.t });
  }

  // ============================================================
  //  Transport wiring -- DOM controls emit the chat chars plus the
  //  whole-string s: seek command.
  // ============================================================
  function togglePlay() { send(' '); }
  // (speed chips + their speed->command map live in the shared chrome)
  $('btn-play').addEventListener('click', togglePlay);
  $('btn-restart').addEventListener('click', function () { send(','); });
  $('btn-back').addEventListener('click', function () { send('b'); });
  $('btn-fwd').addEventListener('click', function () { send('.'); });
  $('btn-end').addEventListener('click', function () { send('e'); });
  $('btn-loop').addEventListener('click', function () { send('r'); });
  $('btn-skip').addEventListener('click', function () { send('f'); });

  // click-to-seek: map x-fraction to a tick and send s:<tick>
  function seekToFraction(s, frac) {
    var st = Math.max(0, s.st || 0);
    var mx = Math.max(st + 1, s.mx || 1);
    send('s:' + (st + Math.round(frac * (mx - st))));
    var card = $('endcard');
    if (card) card.classList.remove('on');
  }

  $('scrub').addEventListener('click', function (ev) {
    var rect = this.getBoundingClientRect();
    var frac = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
    // The axis lives on the frame, so a click before the first frame cannot be
    // mapped yet -- QUEUE it rather than dropping it. A dropped first click is
    // invisible: the board is already drawn and the viewer just does not move.
    if (!lastState || !lastState.en) { SEEK_FRAC = frac; return; }
    seekToFraction(lastState, frac);
  });

  // keyboard shortcuts mirror the transport
  window.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var k = ev.key;
    if (k === ' ') { ev.preventDefault(); togglePlay(); }
    else if (k === ',' || k === '<') send(',');
    else if (k === '.' || k === '>') send('.');
    else if (k === 'b') send('b');
    else if (k === 'e') send('e');
    else if (k === 'r') send('r');
    else if (k === 'f') send('f');
    else if (k === 'o') {
      setSpoilers(!getSpoilers());
      // the appended block gates its own markers -- and a toggle while paused
      // has no frame coming to do it
      if (window.MagentChrome && window.MagentChrome.applySpoilers) {
        window.MagentChrome.applySpoilers(lastState);
      }
    }
    else if (k === 'h' && window.MagentChrome) window.MagentChrome.toggleHeat();
    else if (k >= '1' && k <= '9') send(k);
    else if (k === 'Escape') postToShell('esc');
  });

  // ============================================================
  //  Fixed-aspect fit: size the composition to the board's native aspect
  //  inside the embed box, then scale the whole thing (board + overlays) as
  //  one unit. Chrome sizes off the STAGE width, so overlays stay locked to
  //  the graphics at any container shape.
  // ============================================================
  function relayout() {
    var boxW = viewport.clientWidth, boxH = viewport.clientHeight;
    if (!boxW || !boxH) return;
    // The board region fits the board aspect into the box BETWEEN a reserved
    // top band (the scorebug) and bottom band (the transport), so neither ever
    // sits over play. Each band's pixel height depends on --hudscale (-> board
    // width) and the board fit depends on the bands, so iterate to a FIXED
    // POINT: stop as soon as a pass measures the same bands it was laid out
    // with.
    var scorebug = document.getElementById('scorebug');
    var transport = document.getElementById('transport');
    var root = document.documentElement;
    var topBand = parseFloat(getComputedStyle(root).getPropertyValue('--topband')) || 0;
    var band = parseFloat(getComputedStyle(root).getPropertyValue('--band')) || 0;
    var stageW = 0, stageH = 0;
    for (var pass = 0; pass < 4; pass++) {
      var prevTop = topBand, prevBand = band;
      var availH = Math.max(1, boxH - topBand - band);
      var boardW, boardH;
      if (boxW / availH > BOARD_ASPECT) {
        boardH = availH; boardW = Math.round(availH * BOARD_ASPECT);
      } else {
        boardW = boxW; boardH = Math.round(boxW / BOARD_ASPECT);
      }
      stageW = boardW; stageH = boardH + topBand + band;
      stage.style.width = stageW + 'px';
      stage.style.height = stageH + 'px';
      // One scale for the whole composition: chrome was authored against a
      // ~760px-wide reference board, so --hudscale is the board's on-screen
      // width over that reference (clamped so a huge featured embed doesn't
      // bloat the chrome and a tiny 360px floor stays legible).
      var scale = Math.max(0.5, Math.min(1.6, boardW / 760));
      root.style.setProperty('--hudscale', scale.toFixed(3));
      // UNDER 640px of board the density drops to .tiny and the plate labels
      // go. The starter toggles at 620; this fork uses the 640 the checklist
      // and the game block's own CSS comment both state, so the 621-640 px
      // band is no longer a strip where the labels stay and the comment lies.
      stage.classList.toggle('tiny', boardW < 640);
      // Measure each band's natural height -> reserve exactly that.
      topBand = scorebug ? scorebug.offsetHeight : 0;
      band = transport ? transport.offsetHeight : 0;
      root.style.setProperty('--topband', topBand + 'px');
      root.style.setProperty('--band', band + 'px');
      if (Math.abs(topBand - prevTop) < 0.5 && Math.abs(band - prevBand) < 0.5) break;
    }
    core.setViewportFit();
  }
  var ro = new ResizeObserver(relayout);
  ro.observe(viewport);
  window.addEventListener('resize', relayout);

  // The context the appended MAGENT-BATTLE block reads the inherited chrome
  // through. Declared here (hoisted `var`, so onFrame sees it however early
  // the first frame lands) rather than duplicating any of it: the game block
  // must not re-implement naming, escaping, feed insertion or the transport.
  MG_CTX = {
    $: $, C: C, esc: esc, fmt: fmt, send: send,
    teamCol: teamCol, teamHeadline: teamHeadline,
    pushFeed: pushFeed, banner: banner, beatPulse: beatPulse,
    core: core,
    getState: function () { return lastState; }
  };
  if (window.MagentChrome) window.MagentChrome.install(MG_CTX);
  // Exposed for tools/ci/renderer_fixture.html ONLY: the worst-case text
  // fixture drives the SHIPPED page's own feed path rather than
  // re-implementing it (the particle-worlds 2026-08-26 scar), and it needs the
  // same context object the game block is installed with.
  window.MAGENT_CTX = MG_CTX;

  relayout();
  core.start();
})();
</script>
<!-- ============================================================
     MAGENT-BATTLE additions to the inherited coworld-ctf chrome
     ============================================================
     Everything above this banner is the coworld-ctf broadcast page. Its CSS,
     markup, relayout(), transport wiring, endcard shell, locker-room curtain,
     ?embed=1 mode and .tiny density system are the starter's; the elements the
     design note lists as removed (all of #viewpanel -- the board is a fixed
     45x45 grid with a 1:1 aspect, so zoom and the minimap have nothing to do
     -- the whole #fpv first-person PIP, #povBadge, the ctf scorebug internals,
     the beat kinds this game never emits, and the perk/handicap badges) are
     deleted rather than disabled, and the endcard/chrome vocabulary is
     re-mapped off paintbot's (Lives -> Troops left, LIVES LEAD -> TROOPS
     LEAD, Clstr/Cap -> Alive/Reward, and so on).

     Nothing here touches the transport band. relayout() still owns --hudscale,
     --topband and --band on :root; the endcard still stops at
     bottom: var(--band, 0px) and is still dismissed by every seek; and every
     scrubber beat this block draws is a LABELLED, CLICKABLE BUTTON that seeks
     on click, styled for EVERY kind the sim emits and no others -- firstblood,
     rout, wipe, fallback, end. The builder is called battleBeat precisely so
     it can never be shadowed by the chrome alias block's own hoisted
     declaration of markBeat (cogame-tandem, 2026-08-23).
     ============================================================ -->
<style>
/* --- the muster curtain never swallows a transport click ---------------- */
/* The inherited curtain covers the viewport at z-index 25 and only becomes
   click-through when `.gone` lands, which is LOCKER_MIN_DWELL_MS (900 ms)
   after the first frame -- so for the first ~900 ms every click on the
   scrubber, the play button or a beat marker is eaten by a decorative scene.
   A human rarely notices; a headless smoke clicks at ~400 ms and its
   "mid-replay seek" readout is then the frame it started on (r1 review F14).
   The curtain has no interactive children in this fork -- backdrop, sprites
   and a rotating caption -- so it is decoration and says so. The fade,
   the dwell and every inherited rule are untouched. */
#lockerroom { pointer-events: none; }

/* --- scorebug: side chip, alive numeral, fallback glyph ----------------- */
/* The plate name must survive a 360px featured-match iframe: it grows into
   whatever room the plate has and ellipsises only when it genuinely runs out,
   never collapsing to a bare "..." . */
.plate-name {
  flex: 1 1 auto;
  min-width: 3.2em;
  overflow: hidden;
  text-overflow: ellipsis;
}
.plate .plate-alias {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  letter-spacing: 0.14em;
  color: var(--paper-dim);
  white-space: nowrap;
  flex: none;
}
.plate .side-chip {
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #16110d;
  padding: calc(1 * var(--u)) calc(3 * var(--u));
  border-radius: calc(2 * var(--u));
  flex: none;
}
.plate .alive-label {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--paper-dim);
  flex: none;
}
.plate .alive-num {
  font-family: var(--pixfont);
  font-size: calc(22 * var(--u));
  line-height: 1;
  font-variant-numeric: tabular-nums;
  flex: none;
}
.plate .kill-num {
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
  flex: none;
}
.plate .fb-glyph {
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  color: var(--amber);
  flex: none;
}
/* Under 640px of board the labels go: each plate keeps only
   alias + name + alive count, and the kills numeral is hidden. `.tiny` is
   toggled by relayout() at boardW < 640 (page_script.js). */
#stage.tiny .plate .alive-label,
#stage.tiny .plate .kill-num,
#stage.tiny .plate .fb-glyph { display: none; }

/* --- the HEAT toggle, in the TOP band and never in the transport band --- */
#heatchip {
  position: absolute;
  top: calc(3 * var(--u));
  right: calc(6 * var(--u));
  z-index: 6;
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper-dim);
  background: rgba(12, 9, 6, 0.62);
  border: 0;
  padding: calc(3 * var(--u)) calc(6 * var(--u));
  cursor: pointer;
}
#heatchip.on { color: var(--amber); box-shadow: inset 0 0 0 1px currentColor; }

/* --- scrubber beats: one rule per kind the sim emits, and no others ----- */
/* Buttons, not divs: each carries a title + aria-label and seeks on click. */
button.beat-marker {
  border: 0;
  padding: 0;
  cursor: pointer;
  appearance: none;
  background: var(--paper-dim);
}
.beat-marker.firstblood {
  background: var(--paper);
  width: calc(3 * var(--u));
  height: calc(12 * var(--u));
}
.beat-marker.rout { width: calc(3 * var(--u)); height: calc(10 * var(--u)); }
.beat-marker.rout.red { background: var(--red); }
.beat-marker.rout.blue { background: var(--blue); }
.beat-marker.wipe { width: calc(4 * var(--u)); height: calc(14 * var(--u)); }
.beat-marker.wipe.red { background: var(--red); }
.beat-marker.wipe.blue { background: var(--blue); }
.beat-marker.fallback {
  background: var(--amber);
  width: calc(2 * var(--u));
  height: calc(7 * var(--u));
  opacity: 0.9;
}
.beat-marker.end {
  background: var(--amber);
  width: calc(3 * var(--u));
  height: calc(14 * var(--u));
}

/* --- endcard columns and the per-game rows ----------------------------- */
.ec-thead, .ec-trow {
  display: grid;
  grid-template-columns: 1.6fr 0.7fr 0.7fr 0.7fr 1fr;
  gap: calc(4 * var(--u));
  font-size: calc(9 * var(--u));
}
.ec-thead {
  color: var(--paper-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-top: calc(4 * var(--u));
}
.ec-trow { font-variant-numeric: tabular-nums; }
.ec-tname {
  font-family: var(--pixfont);
  font-size: calc(14 * var(--u));
  letter-spacing: 0.1em;
}
.ec-tfoot {
  display: flex;
  align-items: baseline;
  gap: calc(6 * var(--u));
  margin-top: calc(4 * var(--u));
}
.ec-tfoot .fl-cap {
  font-size: calc(8 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--paper-dim);
}
.ec-tfoot .fl-num {
  font-family: var(--pixfont);
  font-size: calc(18 * var(--u));
  font-variant-numeric: tabular-nums;
}

/* --- feed rows -------------------------------------------------------- */
.feed-row .mg-order { color: var(--amber); }
.feed-row .mg-say { color: var(--paper); font-style: italic; }
</style>
<script>
(function () {
  'use strict';
  // Every name here carries an mg-/battle- prefix ON PURPOSE. The page's chrome
  // alias block declares the shared beat builder with a hoisted `var markBeat`,
  // so a game-block function of that same name would be silently swallowed by
  // it and the scrubber would end up with unlabelled div markers that never
  // seek (cogame-tandem, 2026-08-23). tests/test_magent_viewer.nim asserts the
  // whole alias list is untouched below this banner.
  var CTX = null;
  var placed = {};          // "tick|kind|side" -> true (dedup)
  var mgMarkers = [];       // this block's marker buttons (the spoiler gate)
  var beatsPlaced = false;
  var heatOn = true;

  function mgId(id) { return document.getElementById(id); }

  function scrubGeometry(s) {
    var st = Math.max(0, s.st || 0);
    var mx = Math.max(st + 1, s.mx || 1);
    return { st: st, span: mx - st };
  }

  // battleBeat -- NEVER markBeat. Appends a LABELLED, CLICKABLE button to
  // #scrub that seeks on click.
  function battleBeat(s, tick, kind, side, label) {
    var key = tick + '|' + kind + '|' + (side || '');
    if (placed[key]) return;
    placed[key] = true;
    var scrub = mgId('scrub');
    if (!scrub) return;
    var g = scrubGeometry(s);
    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'beat-marker ' + kind + (side ? ' ' + side : '');
    el.style.left =
      (Math.min(1, Math.max(0, (tick - g.st) / g.span)) * 100) + '%';
    el.title = label + ' \u2014 click to jump here';
    el.setAttribute('aria-label', label);
    el.__tick = tick;
    el.addEventListener('click', function (ev) {
      ev.stopPropagation();
      CTX.send('s:' + tick);
    });
    scrub.appendChild(el);
    mgMarkers.push(el);
  }

  // [spoilers] gate for THIS block's markers. The shared chrome walks only its
  // own marker list, so with spoilers off its kill/flag markers hide and these
  // five kinds would still sit on the scrubber ahead of the playhead -- while
  // the retitled #btn-spoilers tooltip promises "kills / routs / winner on the
  // timeline ahead of the playhead". Same rule, same tick comparison, applied
  // to the buttons this block appended.
  function mgSpoilerGate(s) {
    if (!s || !CTX || !CTX.C || !CTX.C.getSpoilers) return;
    var spoilers = CTX.C.getSpoilers();
    for (var i = 0; i < mgMarkers.length; i++) {
      var el = mgMarkers[i];
      var hide = !spoilers && el.__tick > s.t;
      if (el.__hidden !== hide) {
        el.__hidden = hide;
        el.style.display = hide ? 'none' : '';
      }
    }
  }

  function feedRow(html, cls) {
    var row = document.createElement('div');
    row.className = 'feed-row' + (cls ? ' ' + cls : '');
    row.innerHTML = html;
    CTX.pushFeed(row);
  }

  function aliasOf(s, slot) {
    var seats = (s.mg && s.mg.seats) || [];
    return (seats[slot] && seats[slot].alias) || ('SEAT ' + slot);
  }

  // The HEAT toggle lives in the TOP band, never in the transport band.
  function ensureHeatChip() {
    if (mgId('heatchip')) return;
    var chrome = mgId('chrome');
    if (!chrome) return;
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.id = 'heatchip';
    chip.textContent = 'heat';
    chip.title = 'Army density overlay (h)';
    chip.setAttribute('aria-label', 'Toggle the army density overlay');
    chip.classList.add('on');
    chip.addEventListener('click', toggleHeat);
    chrome.appendChild(chip);
  }

  function toggleHeat() {
    heatOn = !heatOn;
    var chip = mgId('heatchip');
    if (chip) chip.classList.toggle('on', heatOn);
    if (CTX && CTX.core && CTX.core.setHeat) CTX.core.setHeat(heatOn);
  }

  // Plain language, never internal notation.
  function mgEvent(event, s) {
    switch (event.k) {
      case 'order':
        feedRow('<span class="mg-order">' + CTX.esc(aliasOf(s, event.slot)) +
          ' ' + CTX.esc(event.squad) + ' \u2192 ' + CTX.esc(event.verb) +
          (event.arg ? ' ' + CTX.esc(event.arg) : '') + '</span>');
        return true;
      case 'say':
        feedRow('<span class="mg-say">' +
          CTX.esc(aliasOf(s, event.slot).charAt(0) +
            aliasOf(s, event.slot).slice(1).toLowerCase()) +
          ': \u201c' + CTX.esc(event.text) + '\u201d</span>');
        return true;
      case 'fallback':
        feedRow(CTX.esc(aliasOf(s, event.slot)) +
          ' MISSED THE CALL \u2014 scripted orders (' +
          CTX.esc(event.cause) + ')');
        battleBeat(s, s.t, 'fallback', '',
          aliasOf(s, event.slot) + ' fell back to scripted orders');
        return true;
      case 'firstblood':
        feedRow('<b>FIRST BLOOD \u2014 ' + CTX.esc(aliasOf(s, event.slot)) +
          '</b>');
        CTX.banner('FIRST BLOOD \u2014 ' + aliasOf(s, event.slot), 'firstblood');
        CTX.beatPulse();
        battleBeat(s, s.t, 'firstblood', '',
          'First blood - ' + aliasOf(s, event.slot));
        return true;
      case 'rout':
        feedRow('<b>' + CTX.esc(aliasOf(s, event.army)) +
          ' IS ROUTED \u2014 ' + event.lost + ' DOWN</b>');
        CTX.banner(aliasOf(s, event.army) + ' IS ROUTED', 'rout');
        CTX.beatPulse();
        return true;
      case 'wipe':
        feedRow('<b>' + CTX.esc(aliasOf(s, event.army)) +
          ' IS WIPED OUT</b>');
        CTX.banner(aliasOf(s, event.army) + ' IS WIPED OUT', 'wipe');
        CTX.beatPulse();
        return true;
      case 'end':
      case 'turn':
      case 'kill':
        return true;
      default:
        return false;
    }
  }

  // The pre-scanned beat timeline arrives once, on the first frame, so every
  // marker is on the scrubber at full width before playback reaches it.
  function placeBeats(s) {
    if (beatsPlaced || !s.beats) return;
    beatsPlaced = true;
    for (var i = 0; i < s.beats.length; i++) {
      var b = s.beats[i];
      battleBeat(s, b.t, b.k, b.side || '', b.label || b.k);
    }
  }

  function frame(s, ctx, jumped) {
    CTX = ctx;
    ensureHeatChip();
    // `placed` is NOT cleared on a backward jump. A marker is a permanent
    // annotation of the timeline, and the buttons already on #scrub are not
    // removed by a seek -- so clearing the dedup map only let a live
    // fallback/firstblood event replayed after the seek append a SECOND button
    // at the same offset (r1 review F12).
    placeBeats(s);
    var events = (s.mg && s.mg.events) || [];
    for (var i = 0; i < events.length; i++) mgEvent(events[i], s);
    mgSpoilerGate(s);
  }

  window.MagentChrome = {
    install: function (ctx) {
      CTX = ctx;
      ensureHeatChip();
      if (ctx && ctx.core && ctx.core.setHeat) ctx.core.setHeat(heatOn);
      // The toggle can flip while playback is PAUSED, when no frame is coming
      // to re-run the gate, so re-apply on the click as well.
      var spoilerBtn = mgId('btn-spoilers');
      if (spoilerBtn) {
        spoilerBtn.addEventListener('click', function () {
          mgSpoilerGate(CTX && CTX.getState ? CTX.getState() : null);
        });
      }
    },
    frame: frame,
    toggleHeat: toggleHeat,
    battleBeat: battleBeat,
    applySpoilers: mgSpoilerGate
  };
})();
</script>
</body>
</html>
